name: Build & Attach PHAR

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          ini-values: phar.readonly=0

      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build PHAR
        run: php pilot app:build pilot --build-version="${GITHUB_REF_NAME}" --no-interaction

      - name: Attach PHAR to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" builds/pilot --clobber
